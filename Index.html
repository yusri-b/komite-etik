<!doctype html>
<html lang="id" class="h-full bg-slate-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSUD Mamuju Tengah - Sistem Pengaduan Komite Etik</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              medical: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                500: "#0284c7",
                600: "#0369a1",
                700: "#075985",
                800: "#0c4a6e",
              },
            },
          },
        },
      };
    </script>

    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .timeline-item::before {
        content: "";
        position: absolute;
        left: 9px;
        top: 24px;
        bottom: -16px;
        width: 2px;
        background-color: #e2e8f0;
      }
      .timeline-item:last-child::before {
        display: none;
      }
    </style>
  </head>

  <body
    class="h-full bg-slate-50 text-slate-800 antialiased selection:bg-medical-500 selection:text-white"
  >
    <!-- 1. LOGIN & PUBLIC ENTRY SCREEN -->
    <div
      id="login-screen"
      class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-slate-900 relative overflow-hidden"
    >
      <!-- Subtle Background Glows -->
      <div
        class="absolute -top-40 -left-40 w-96 h-96 bg-medical-600/20 rounded-full blur-3xl pointer-events-none"
      ></div>
      <div
        class="absolute -bottom-40 -right-40 w-96 h-96 bg-teal-500/20 rounded-full blur-3xl pointer-events-none"
      ></div>

      <div class="sm:mx-auto sm:w-full sm:max-w-md z-10">
        <div class="flex justify-center items-center space-x-3">
          <div
            class="h-12 w-12 rounded-2xl bg-medical-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-medical-600/50"
          >
            <i class="fa-solid fa-hospital-user"></i>
          </div>
          <span class="text-2xl font-black tracking-tight text-white"
            >RSUD <span class="text-medical-500">Mamuju Tengah</span></span
          >
        </div>
        <h2
          class="mt-4 text-center text-xs font-semibold uppercase tracking-widest text-slate-400"
        >
          Sistem Pengaduan Komite Medik Rumah Sakit Mamuju Tengah
        </h2>
      </div>

      <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md z-10 px-4">
        <div
          class="bg-white/95 backdrop-blur-md py-8 px-6 shadow-2xl rounded-3xl border border-white/20 sm:px-10 space-y-6"
        >
          <!-- Error Alert -->
          <div
            id="login-error"
            class="hidden rounded-2xl bg-rose-50 p-4 border border-rose-200"
          >
            <div class="flex items-center space-x-3">
              <i class="fa-solid fa-circle-exclamation text-rose-600"></i>
              <p
                id="login-error-text"
                class="text-xs font-semibold text-rose-800"
              >
                Login gagal
              </p>
            </div>
          </div>

          <form
            id="form-login"
            onsubmit="handleLoginSubmit(event)"
            class="space-y-4"
          >
            <div>
              <label
                class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5"
                >Nama Pengguna / Username</label
              >
              <div class="relative">
                <i
                  class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-xs"
                ></i>
                <input
                  type="text"
                  id="login-username"
                  required
                  class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all"
                  placeholder="Masukkan username Anda"
                />
              </div>
            </div>

            <div>
              <label
                class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5"
                >Kata Sandi / Password</label
              >
              <div class="relative">
                <i
                  class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"
                ></i>
                <input
                  type="password"
                  id="login-password"
                  required
                  class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all"
                  placeholder="••••••••"
                />
              </div>
            </div>

            <button
              type="submit"
              class="w-full flex justify-center items-center space-x-2 py-3 px-4 rounded-xl text-xs font-bold text-white bg-medical-600 hover:bg-medical-700 focus:outline-none shadow-lg shadow-medical-600/30 transition-all"
            >
              <span id="login-btn-text">Masuk Ke Sistem</span>
              <i
                id="login-btn-spinner"
                class="fa-solid fa-circle-notch fa-spin hidden"
              ></i>
            </button>
          </form>

          <div class="relative my-4">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-slate-200"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
              <span
                class="bg-white px-3 text-slate-400 font-semibold text-[10px]"
                >Akses Publik / Tanpa Login</span
              >
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button
              type="button"
              onclick="showPublicView('create')"
              class="w-full py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition-all flex items-center justify-center space-x-2"
            >
              <i class="fa-solid fa-pen-to-square text-medical-600"></i>
              <span>Buat Pengaduan</span>
            </button>
            <button
              type="button"
              onclick="showPublicView('track')"
              class="w-full py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition-all flex items-center justify-center space-x-2"
            >
              <i class="fa-solid fa-magnifying-glass text-teal-600"></i>
              <span>Lacak Status</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. PUBLIC ANONYMOUS / GUEST CONTAINER -->
    <div
      id="public-view-container"
      class="hidden min-h-screen bg-slate-50 p-4 sm:p-8"
    >
      <div class="max-w-3xl mx-auto space-y-4">
        <button
          onclick="hidePublicView()"
          class="inline-flex items-center space-x-2 text-xs font-bold text-slate-600 hover:text-slate-900 bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm transition-all"
        >
          <i class="fa-solid fa-arrow-left"></i>
          <span>Kembali ke Halaman Login</span>
        </button>

        <div
          id="public-content-area"
          class="bg-white p-6 rounded-3xl border border-slate-100 shadow-xl"
        >
          <!-- Content dynamically injected -->
        </div>
      </div>
    </div>

    <!-- 3. MAIN AUTHENTICATED APP SHELL -->
    <div id="app-shell" class="hidden min-h-screen flex flex-col lg:flex-row">
      <!-- Mobile Navigation Drawer Backdrop -->
      <div
        id="mobile-sidebar-backdrop"
        onclick="toggleMobileSidebar()"
        class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 lg:hidden"
      ></div>

      <!-- Mobile Sidebar Drawer -->
      <aside
        id="mobile-sidebar"
        class="fixed inset-y-0 left-0 w-72 bg-slate-900 text-slate-300 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out lg:hidden flex flex-col justify-between p-4"
      >
        <div class="space-y-6">
          <div class="flex items-center justify-between px-2 pt-2">
            <div class="flex items-center space-x-2">
              <div
                class="h-8 w-8 rounded-xl bg-medical-600 text-white flex items-center justify-center font-bold"
              >
                <i class="fa-solid fa-hospital-user text-sm"></i>
              </div>
              <span class="font-black text-white text-base">SIMPEL MEDIK</span>
            </div>
            <button
              onclick="toggleMobileSidebar()"
              class="text-slate-400 hover:text-white"
            >
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>
          </div>

          <nav id="mobile-nav-container" class="space-y-1">
            <!-- Dynamically populated -->
          </nav>
        </div>

        <div class="border-t border-slate-800 pt-4 px-2">
          <button
            onclick="handleLogout()"
            class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-rose-400 hover:bg-rose-500/10 transition-all"
          >
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Keluar</span>
          </button>
        </div>
      </aside>

      <!-- Desktop Sidebar -->
      <aside
        class="hidden lg:flex w-64 bg-slate-900 text-slate-300 flex-col justify-between p-5 border-r border-slate-800 shrink-0"
      >
        <div class="space-y-8">
          <div class="flex items-center space-x-3 px-2">
            <div
              class="h-10 w-10 rounded-xl bg-medical-600 text-white flex items-center justify-center text-xl shadow-lg shadow-medical-600/30"
            >
              <i class="fa-solid fa-hospital-user"></i>
            </div>
            <div>
              <span class="font-black text-white text-base block leading-none"
                >SIMPEL MEDIK</span
              >
              <span class="text-[10px] text-slate-400 font-medium"
                >Komite Etik RS</span
              >
            </div>
          </div>

          <nav id="desktop-nav-container" class="space-y-1.5">
            <!-- Dynamically populated -->
          </nav>
        </div>

        <div class="border-t border-slate-800 pt-4 space-y-3">
          <div class="flex items-center space-x-3 px-2">
            <div
              class="h-9 w-9 rounded-xl bg-slate-800 text-medical-500 flex items-center justify-center font-bold text-sm"
            >
              <i class="fa-solid fa-user-doctor"></i>
            </div>
            <div class="overflow-hidden">
              <p
                id="user-display-name"
                class="text-xs font-bold text-white truncate"
              >
                Dr. Pengguna
              </p>
              <p
                id="user-display-role"
                class="text-[10px] text-slate-400 truncate"
              >
                Role
              </p>
            </div>
          </div>

          <button
            onclick="handleLogout()"
            class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs font-semibold text-rose-400 hover:bg-rose-500/10 transition-all"
          >
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Keluar System</span>
          </button>
        </div>
      </aside>

      <!-- Main Content Container -->
      <main class="flex-1 flex flex-col min-w-0 bg-slate-50 min-h-screen">
        <!-- Topbar Header -->
        <header
          class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm"
        >
          <div class="flex items-center space-x-3">
            <button
              onclick="toggleMobileSidebar()"
              class="lg:hidden text-slate-600 hover:text-slate-900 text-lg p-1.5 rounded-lg border border-slate-200"
            >
              <i class="fa-solid fa-bars"></i>
            </button>
            <h1
              id="page-title"
              class="text-base sm:text-lg font-bold text-slate-800"
            >
              Dashboard Utama
            </h1>
          </div>

          <div class="flex items-center space-x-3">
            <span
              class="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200"
            >
              <span
                class="h-1.5 w-1.5 rounded-full bg-emerald-500 mr-2 animate-pulse"
              ></span>
              Sistem Aktif
            </span>
          </div>
        </header>

        <!-- Dynamic Page View Container -->
        <div id="app-view" class="p-4 sm:p-8 flex-1">
          <!-- Rendered view content -->
        </div>
      </main>
    </div>

    <!-- 4. MODAL CONTAINER -->
    <div
      id="modal-container"
      class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto"
    >
      <div
        class="bg-white rounded-3xl border border-slate-100 shadow-2xl w-full max-w-lg p-6 relative max-h-[90vh] overflow-y-auto"
      >
        <button
          onclick="closeModal()"
          class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 h-8 w-8 rounded-full flex items-center justify-center bg-slate-100"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- 5. TOAST NOTIFICATION CONTAINER -->
    <div
      id="toast-container"
      class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"
    ></div>

    <script>
      // Global Application State
      const State = {
        currentUser: null,
        sessionToken: null,
        currentView: "dashboard",
      };

      // Unified API Layer supporting both native Apps Script & Editor Preview Mocking
      const API = {
        call: function (fnName, ...args) {
          return new Promise((resolve) => {
            if (
              typeof google !== "undefined" &&
              google.script &&
              google.script.run
            ) {
              const runner = google.script.run
                .withSuccessHandler((res) =>
                  resolve(
                    res || {
                      success: false,
                      message: "Respon server tidak valid atau kosong",
                    },
                  ),
                )
                .withFailureHandler((err) =>
                  resolve({
                    success: false,
                    message: (err && err.message) || "Terjadi kesalahan server",
                  }),
                );

              if (typeof runner[fnName] === "function") {
                runner[fnName](...args);
              } else {
                console.warn(
                  `[API.call] Backend function '${fnName}' is not defined on google.script.run.`,
                );
                const mockRes = getMockResponse(fnName, args);
                if (mockRes) {
                  resolve(mockRes);
                } else {
                  resolve({
                    success: false,
                    message: `Fungsi backend '${fnName}' tidak ditemukan atau belum dideploy di Code.gs.`,
                  });
                }
              }
            } else {
              // Mock Response Layer for Preview Mode
              setTimeout(() => {
                const mockRes = getMockResponse(fnName, args);
                resolve(
                  mockRes || {
                    success: false,
                    message: "Mock data tidak ditemukan",
                  },
                );
              }, 300);
            }
          });
        },
      };

      window.addEventListener("DOMContentLoaded", () => {
        initApp();
      });

      function initApp() {
        const savedToken = localStorage.getItem("simpel_medik_token");
        if (savedToken) {
          State.sessionToken = savedToken;
          API.call("validateSession", savedToken).then((res) => {
            if (res && res.success && res.data) {
              State.currentUser = res.data.user;
              initAppShell();
              navigate("dashboard");
            } else {
              showLoginScreen();
            }
          });
        } else {
          showLoginScreen();
        }
      }

      function showLoginScreen() {
        document.getElementById("login-screen").classList.remove("hidden");
        document.getElementById("app-shell").classList.add("hidden");
        document
          .getElementById("public-view-container")
          .classList.add("hidden");
      }

      function initAppShell() {
        document.getElementById("login-screen").classList.add("hidden");
        document
          .getElementById("public-view-container")
          .classList.add("hidden");
        document.getElementById("app-shell").classList.remove("hidden");

        if (State.currentUser) {
          document.getElementById("user-display-name").innerText =
            State.currentUser.full_name || State.currentUser.username;
          document.getElementById("user-display-role").innerText =
            State.currentUser.role_id || "User";
        }
        buildNavigationMenu();
      }

      function buildNavigationMenu() {
        const role = State.currentUser
          ? State.currentUser.role_id
          : "ROL-PELAPOR";

        const navItems = [
          {
            id: "dashboard",
            label: "Dashboard",
            icon: "fa-chart-pie",
            roles: ["ALL"],
          },
          {
            id: "complaints",
            label: "Pengaduan",
            icon: "fa-file-medical",
            roles: ["ALL"],
          },
          {
            id: "reports",
            label: "Laporan",
            icon: "fa-chart-column",
            roles: [
              "ROL-ADMIN",
              "ROL-SEKRETARIAT",
              "ROL-ANGGOTA_KOMITE_MEDIK",
              "ROL-KETUA_KOMITE_MEDIK",
            ],
          },
          {
            id: "audit-log",
            label: "Audit Log",
            icon: "fa-clock-rotate-left",
            roles: ["ROL-ADMIN"],
          },
          {
            id: "master-data",
            label: "Master Data",
            icon: "fa-database",
            roles: ["ROL-ADMIN"],
          },
        ];

        const desktopContainer = document.getElementById(
          "desktop-nav-container",
        );
        const mobileContainer = document.getElementById("mobile-nav-container");

        if (!desktopContainer || !mobileContainer) return;

        desktopContainer.innerHTML = "";
        mobileContainer.innerHTML = "";

        const createNavButton = (item) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.onclick = (e) => {
            e.preventDefault();
            navigate(item.id);
          };
          btn.className = `w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
            State.currentView === item.id
              ? "bg-medical-600 text-white shadow-md shadow-medical-600/30"
              : "text-slate-400 hover:text-white hover:bg-slate-800"
          }`;
          btn.innerHTML = `<i class="fa-solid ${item.icon} text-sm w-5 text-center"></i><span>${item.label}</span>`;
          return btn;
        };

        navItems.forEach((item) => {
          if (item.roles.includes("ALL") || item.roles.includes(role)) {
            desktopContainer.appendChild(createNavButton(item));
            mobileContainer.appendChild(createNavButton(item));
          }
        });
      }

      async function navigate(viewName, params = {}) {
        State.currentView = viewName;
        buildNavigationMenu();

        const viewContainer = document.getElementById("app-view");
        const pageTitle = document.getElementById("page-title");

        // Close mobile sidebar if active
        document
          .getElementById("mobile-sidebar")
          .classList.add("-translate-x-full");
        document
          .getElementById("mobile-sidebar-backdrop")
          .classList.add("hidden");

        viewContainer.innerHTML =
          '<div class="flex justify-center p-12"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-medical-600"></i></div>';

        switch (viewName) {
          case "dashboard":
            pageTitle.innerText = "Dashboard Utama";
            await renderDashboardView(viewContainer);
            break;
          case "complaints":
            pageTitle.innerText = "Daftar Pengaduan";
            await renderComplaintsListView(viewContainer);
            break;
          case "complaint-create":
            pageTitle.innerText = "Buat Pengaduan Baru";
            renderComplaintCreateForm(viewContainer);
            break;
          case "complaint-detail":
            pageTitle.innerText = "Detail Pengaduan";
            await renderComplaintDetailView(viewContainer, params.complaintId);
            break;
          case "reports":
            pageTitle.innerText = "Laporan & Analytics";
            await renderReportsView(viewContainer);
            break;
          case "audit-log":
            pageTitle.innerText = "Audit Log Sistem";
            renderAuditLogView(viewContainer);
            break;
          case "master-data":
            pageTitle.innerText = "Master Data Sistem";
            renderMasterDataView(viewContainer);
            break;
          default:
            pageTitle.innerText = "Dashboard";
            await renderDashboardView(viewContainer);
        }
      }

      async function renderDashboardView(container) {
        try {
          const res = await API.call("getDashboardSummary", State.sessionToken);
          const data = res.success
            ? res.data
            : {
                total_complaints: 0,
                submitted_count: 0,
                under_review_count: 0,
                followup_count: 0,
                completed_count: 0,
                overdue_complaints: 0,
              };

          container.innerHTML = `
          <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                  <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Pengaduan</p>
                  <p class="text-2xl font-bold text-slate-800 mt-1">${data.total_complaints}</p>
                </div>
                <div class="h-12 w-12 rounded-xl bg-medical-50 text-medical-600 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-folder-open"></i>
                </div>
              </div>

              <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                  <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Belum Diverifikasi</p>
                  <p class="text-2xl font-bold text-amber-600 mt-1">${data.submitted_count}</p>
                </div>
                <div class="h-12 w-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-clock"></i>
                </div>
              </div>

              <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                  <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Dalam Telaah</p>
                  <p class="text-2xl font-bold text-sky-600 mt-1">${data.under_review_count}</p>
                </div>
                <div class="h-12 w-12 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-stethoscope"></i>
                </div>
              </div>

              <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                <div>
                  <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Selesai</p>
                  <p class="text-2xl font-bold text-emerald-600 mt-1">${data.followup_count}</p>
                </div>
                <div class="h-12 w-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-circle-check"></i>
                </div>
              </div>
            </div>

            ${
              data.overdue_complaints > 0
                ? `
              <div class="rounded-xl bg-rose-50 p-4 border border-rose-200 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <i class="fa-solid fa-triangle-exclamation text-rose-600 text-lg"></i>
                  <div>
                    <p class="text-xs font-bold text-rose-800">Peringatan Overdue SLA</p>
                    <p class="text-xs text-rose-600">Terdapat ${data.overdue_complaints} pengaduan aktif yang telah melewati batas SLA penanganan.</p>
                  </div>
                </div>

      async function triggerExportCSV() {
        try {
          const res = await API.call("exportReport", State.sessionToken);
          if (res.success && res.data) {
            const blob = new Blob([res.data.csv_data], {
              type: "text/csv;charset=utf-8;",
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", res.data.filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("File CSV berhasil diunduh", "success");
          }
        } catch (e) {
          showToast("Gagal memproses export CSV", "error");
        }
      }

      async function loadAuditLogsTable(page = 1) {
        currentAuditPage = page;
        const tbody = document.getElementById("audit-log-table-body");
        const pagEl = document.getElementById("audit-log-pagination");
        const searchVal =
          document.getElementById("filter-audit-search")?.value || "";

        if (!tbody) return;

        tbody.innerHTML =
          '<tr><td colspan="5" class="text-center py-6 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Memuat data...</td></tr>';

        try {
          const res = await API.call("getAuditLogs", State.sessionToken, {
            page: page,
            pageSize: 15,
            search: searchVal,
          });

          if (res && res.success && res.data && res.data.length > 0) {
            tbody.innerHTML = res.data
              .map(
                (item) => `
            <tr class="hover:bg-slate-50/80 transition-colors">
              <td class="py-3 px-4 whitespace-nowrap text-slate-500 font-mono text-[11px]">
                ${formatDateTime(item.timestamp)}
              </td>
              <td class="py-3 px-4 whitespace-nowrap">
                <p class="font-bold text-slate-800">${item.user_name || item.username || "System"}</p>
                <p class="text-[10px] text-slate-400">@${item.username || "system"}</p>
              </td>
              <td class="py-3 px-4 whitespace-nowrap">
                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${getActionBadgeClass(item.action)}">${item.action || "ACTION"}</span>
                <span class="text-[10px] font-medium text-slate-400 block mt-0.5">${item.module || "SYSTEM"}</span>
              </td>
              <td class="py-3 px-4 font-mono text-[11px] text-slate-600 whitespace-nowrap">
                ${item.record_id || "-"}
              </td>
              <td class="py-3 px-4">
                <p class="text-slate-700 font-medium">${item.description || "-"}</p>
                ${
                  item.old_value || item.new_value
                    ? `
                  <div class="mt-1 text-[10px] text-slate-500 font-mono bg-slate-50 p-1.5 rounded border border-slate-200">
                    <span class="text-rose-600 line-through">${item.old_value || "(kosong)"}</span>
                    <i class="fa-solid fa-arrow-right mx-1 text-slate-400"></i>
                    <span class="text-emerald-600 font-bold">${item.new_value || "(kosong)"}</span>
                  </div>
                `
                    : ""
                }
              </td>
            </tr>
          `,
              )
              .join("");

            if (pagEl && res.meta) {
              const { page, totalPages, total } = res.meta;
              pagEl.innerHTML = `
              <span>Menampilkan halaman <strong>${page}</strong> dari <strong>${totalPages}</strong> (Total: ${total} log)</span>
              <div class="flex items-center space-x-1">
                <button onclick="loadAuditLogsTable(${page - 1})" ${page <= 1 ? 'disabled class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-300 cursor-not-allowed"' : 'class="px-2.5 py-1 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-700 font-semibold"'}>
                  <i class="fa-solid fa-chevron-left"></i> Prev
                </button>
                <button onclick="loadAuditLogsTable(${page + 1})" ${page >= totalPages ? 'disabled class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-300 cursor-not-allowed"' : 'class="px-2.5 py-1 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-700 font-semibold"'}>
                  Next <i class="fa-solid fa-chevron-right"></i>
                </button>
              </div>
            `;
            }
          } else if (res && res.success) {
            tbody.innerHTML =
              '<tr><td colspan="5" class="text-center py-6 text-slate-400">Tidak ada riwayat audit log ditemukan.</td></tr>';
            if (pagEl) pagEl.innerHTML = "";
          } else {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-rose-500">${(res && res.message) || "Gagal mengambil audit log."}</td></tr>`;
            if (pagEl) pagEl.innerHTML = "";
          }
        } catch (err) {
          tbody.innerHTML =
            '<tr><td colspan="5" class="text-center py-6 text-rose-500">Error: ' +
            err.message +
            "</td></tr>";
          if (pagEl) pagEl.innerHTML = "";
        }
      }

      function getActionBadgeClass(action) {
        if (!action) return "bg-slate-100 text-slate-700";
        const act = action.toUpperCase();
        if (act.includes("LOGIN")) return "bg-blue-100 text-blue-800";
        if (act.includes("LOGOUT")) return "bg-slate-100 text-slate-600";
        if (act.includes("CREATE")) return "bg-emerald-100 text-emerald-800";
        if (act.includes("UPDATE") || act.includes("STATUS"))
          return "bg-amber-100 text-amber-800";
        if (act.includes("DELETE") || act.includes("REJECT"))
          return "bg-rose-100 text-rose-800";
        if (act.includes("VERIFY") || act.includes("REVIEW"))
          return "bg-sky-100 text-sky-800";
        return "bg-purple-100 text-purple-800";
      }

      function formatDateTime(isoStr) {
        if (!isoStr) return "-";
        const dt = new Date(isoStr);
        if (isNaN(dt.getTime())) return isoStr;
        return (
          dt.toLocaleDateString("id-ID", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          }) +
          " " +
          dt.toLocaleTimeString("id-ID", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          })
        );
      }

            State.sessionToken = res.data.sessionToken;
            State.currentUser = res.data.user;
            localStorage.setItem("simpel_medik_token", State.sessionToken);

            initAppShell();
            navigate("dashboard");

              "Selamat datang, " + State.currentUser.full_name,

          document.getElementById("login-error-text").innerText =
            "Terjadi kesalahan sistem";
          errorEl.classList.remove("hidden");
        } finally {
          btnText.innerText = "Masuk Ke Sistem";
          btnSpinner.classList.add("hidden");

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aplikasi GAS</title>
  </head>
  <body>
    <h2>Koneksi Google Apps Script</h2>
    <button id="btn">Tes Koneksi</button>
    <pre id="hasil">Belum terhubung</pre>

    <script>

        const API_URL = "https://script.google.com/macros/s/AKfycbynjeJJlInF0y7rZAdq2C9CMomXe4bLCjced50Fzv2DMK9nvO-NifDZUhrd44gZN36Itg/exec";
        
      document.getElementById("btn").onclick = async () => {
        const hasil = document.getElementById("hasil");
        hasil.textContent = "Menghubungkan...";
  
        try {
          const response = await fetch(API_URL);
          const data = await response.json();
          hasil.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          hasil.textContent =
            "Koneksi gagal: " + error.message +
            "\nPeriksa konfigurasi CORS dan akses Web App.";
        }
      };

    </script>
  </body>
</html>

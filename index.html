<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aplikasi GAS</title>
  </head>
  <body>
    <h2>Koneksi Google Apps Script</h2>
    <button id="btn">Tes Koneksi</button>
    <pre id="hasil">Belum terhubung</pre>

    <script>

        const API_URL = "https://script.google.com/macros/s/AKfycbzJj2aY4AbJKtlIKbiLz6KRbZTqvIVlJM33snUYCGZSzk_nj305jg2KcFgcjOiP_CXo2A/exec";
        
        function tesKoneksi() {
          const hasil = document.getElementById("hasil");
          hasil.textContent = "Menghubungkan...";
        
          const callback = "gasCallback";
        
          window[callback] = function(data) {
            hasil.textContent = JSON.stringify(data, null, 2);
            delete window[callback];
            script.remove();
          };
        
          const script = document.createElement("script");
          script.src = API_URL +
            "?callback=" + callback +
            "&t=" + Date.now();
        
          script.onerror = function() {
            hasil.textContent =
              "Gagal mengakses Apps Script. Periksa URL dan izin akses.";
            delete window[callback];
            script.remove();
          };
        
          document.body.appendChild(script);
        }
        
        document.getElementById("btn").onclick = tesKoneksi;

    </script>
  </body>
</html>
